name: Publier le portail d’Arélia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Générer les pages depuis le référentiel
        run: python3 src/build.py
      - name: Valider la carte Arélia Maps
        run: python3 src/maps/validate.py
      - name: Vérifier le JavaScript de l'atlas
        run: node --check site/assets/arelia-maps.js
      - name: Vérifier les parcours métropolitains
        run: |
          node --check site/assets/arelia-routing.js
          node src/maps/route_validate.cjs
      - name: Vérifier les échelles et libellés
        run: |
          node --check site/assets/arelia-display.js
          node src/maps/display_validate.cjs
      - name: Valider la couverture géographique nationale
        run: |
          node --check site/assets/arelia-detail.js
          node --check site/assets/arelia-spatial.js
          node src/maps/spatial_validate.cjs
          node --check site/assets/arelia-world.js
          node src/maps/world_validate.cjs
      - name: Tester le démarrage et la navigation de l'atlas
        run: node src/maps/viewer_smoke.cjs
      - name: Vérifier les itinéraires nationaux réels sur le graphe
        run: |
          node --check site/assets/arelia-national-routing.js
          node src/maps/national_route_validate.cjs
          node --check site/assets/arelia-urban-routing.js
          node src/maps/urban_route_validate.cjs
          node --check site/assets/arelia-road-gaps.js
          node src/maps/road_gaps_validate.cjs
      - name: Tester les mesures et leurs avertissements
        run: |
          node --check site/assets/arelia-measure.js
          node src/maps/measure_validate.cjs
      - name: Contrôler les franchissements et les tracés sur l'eau
        run: |
          node --check site/assets/arelia-geo-audit.js
          node src/maps/geo_audit_validate.cjs
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Télécharger le site statique comme artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Déployer le site
        id: deployment
        uses: actions/deploy-pages@v4
